[project]
name = "plataforma-contratos"
version = "0.1.0"
description = "Plataforma de contratos de venda (ZCON) para SAP S/4HANA via OData V4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "BRFertil" }]
classifiers = [
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.119,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=25.0,<26.0",
    "httpx>=0.28,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.30,<1.0",
]

[project.scripts]
plataforma-api = "app.entrypoints.api:main"
plataforma-worker = "app.entrypoints.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.112,<7.0",
    "respx>=0.22,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "import-linter>=2.0,<3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---- Ruff ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (segurança)
    "DTZ",  # flake8-datetimez (datetime sempre com timezone)
    "RUF",  # regras específicas do Ruff
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ERA",  # eradicate (código comentado)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert é esperado em testes
    "S105",  # "password" em variavel de teste (fake)
    "S106",  # "password" em argumento de teste (fake)
    "S107",  # "password" em default de teste (fake)
]

# ---- Mypy ------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---- Import Linter ---------------------------------------------------------
# Regra de dependencia: domain <- application <- infrastructure/api.
# Imports indiretos tambem contam (ex.: domain -> app.settings -> pydantic).

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain e puro (sem web, orm, http, nem pydantic)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "app.infrastructure",
    "app.api",
    "app.application",
]

[[tool.importlinter.contracts]]
name = "application nao conhece web/infra"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["fastapi", "starlette", "app.api", "app.infrastructure"]

[[tool.importlinter.contracts]]
name = "camadas em layers"
type = "layers"
layers = [
    "app.api | app.infrastructure",
    "app.application",
    "app.domain",
]

# ---- Pytest ----------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
filterwarnings = ["error"]

# ---- Coverage --------------------------------------------------------------
# Gate roda em comando separado; não fica no addopts.

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
