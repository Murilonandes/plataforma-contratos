# Alembic — migracoes do schema ``contratos`` (PostgreSQL 16).
#   uv run alembic upgrade head
# A URL vem do DATABASE_URL (ApiSettings: env em dev, Docker secret em qas/prd).
# Nada de credencial aqui. Logging e o JSON do app (env.py chama configure_logging).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
