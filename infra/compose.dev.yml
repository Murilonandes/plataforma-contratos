# Ambiente local de desenvolvimento.
#   docker compose -f infra/compose.dev.yml --env-file infra/.env up
# Portas publicadas so em 127.0.0.1 (nada exposto na rede).

name: plataforma-contratos

x-backend: &backend
  build:
    context: ../backend
  image: plataforma-contratos-backend:dev
  depends_on:
    db:
      condition: service_healthy

# A API recebe SO o banco; a config e a credencial do SAP vao so para o worker.
# Em dev o DATABASE_URL vem do env; em qas/prd, de Docker secret (database_url).
x-env-api: &env-api
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    environment:
      <<: *env-api
    ports:
      - "127.0.0.1:8000:8000"
    # A imagem nao traz HEALTHCHECK (e compartilhada com o worker); declarado aqui.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend
    environment:
      <<: *env-api
      SAP_BASE_URL: ${SAP_BASE_URL}
      SAP_CLIENT: ${SAP_CLIENT}
      SAP_PRD_HOSTS: ${SAP_PRD_HOSTS:-}
      SAP_USER: ${SAP_USER:-}
      SAP_PASS: ${SAP_PASS:-}
    command: ["app.entrypoints.worker"]
    # Sem HTTP: sem healthcheck HTTP. Stub (Fase 2 em andamento) carrega o
    # WorkerSettings e sai com 0.
    restart: "no"

  web:
    build:
      context: ../frontend
    image: plataforma-contratos-web:dev
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
