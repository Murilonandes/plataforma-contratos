# Ambiente local de desenvolvimento.
#   docker compose -f infra/compose.dev.yml --env-file infra/.env up
# Portas publicadas so em 127.0.0.1 (nada exposto na rede).

name: plataforma-contratos

x-backend: &backend
  build:
    context: ../backend
  image: plataforma-contratos-backend:dev
  environment:
    APP_ENV: ${APP_ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SAP_BASE_URL: ${SAP_BASE_URL}
    SAP_CLIENT: ${SAP_CLIENT}
    SAP_PRD_HOSTS: ${SAP_PRD_HOSTS:-}
    SAP_USER: ${SAP_USER:-}
    SAP_PASS: ${SAP_PASS:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["app.entrypoints.worker"]
    # Stub da Fase 0 sai com 0; sem HTTP, entao o HEALTHCHECK da imagem nao se aplica.
    healthcheck:
      disable: true
    restart: "no"

  web:
    build:
      context: ../frontend
    image: plataforma-contratos-web:dev
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
