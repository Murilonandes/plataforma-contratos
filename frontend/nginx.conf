# SPA: rotas do client caem no index.html. Montado em /etc/nginx/conf.d/default.conf.
# CSP fica para a Fase 4/5 (depende dos endpoints do MSAL/Entra ID e da API).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Atencao: add_header dentro de um location DESCARTA os do server, por isso
    # os headers de seguranca sao repetidos nos locations abaixo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health do container (HEALTHCHECK / Traefik).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome: cache longo e imutavel.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca em cache (deploy novo aparece na hora).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
